apiVersion: apps/v1
kind: StatefulSet
metadata:
  creationTimestamp: null
  generation: 1
  labels:
    app: simpleapi
  name: simpleapi
spec:
  podManagementPolicy: OrderedReady
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: simpleapi
  serviceName: simpleapi
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: simpleapi
    spec:
      containers:
      - image: registry.lab.local/openshift/simpleapi:1.2.2
        imagePullPolicy: IfNotPresent
        name: simpleapi
        ports:
        - containerPort: 8080
          protocol: TCP
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
      terminationGracePeriodSeconds: 300
      volumes:
  updateStrategy:
    rollingUpdate:
      partition: 0
    type: RollingUpdate
status:
  replicas: 0
